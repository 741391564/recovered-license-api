services:
  - type: web
    name: via-license-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: AUTO_PASS
        value: "1"
      - key: ADMIN_TOKEN
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://queen-auto-pass.onrender.com
